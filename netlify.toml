[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── Environment variables ───────────────────────────────────────────────────
# Set in the Netlify UI (Site configuration -> Environment variables), and in a
# local .env for `netlify dev`. Listed here as documentation only -- secrets
# must never be written into this file, which is in the repository.
#
#   SANITY_WRITE_TOKEN               writes orders and personalisations
#   STRIPE_SECRET_KEY                creates and reads Checkout sessions
#   STRIPE_WEBHOOK_SECRET            verifies Stripe webhook signatures
#   SANITY_WEBHOOK_SECRET            verifies the Sanity order-shipped webhook
#   RESEND_API_KEY                   transactional email -- the Comic Strip Canvas
#                                    key, NOT another project's
#   EMAIL_FROM                       e.g. "Comic Strip Canvas <orders@comicstripcanvas.co.uk>"
#   TEAM_EMAIL                       where new-order notifications go
#   PERSONALISATION_ACTION_SECRET    shared secret the Studio sends as
#                                    X-CSC-Action-Secret on Approve / Hold /
#                                    Re-render. The Studio side of the same value
#                                    is SANITY_STUDIO_PERSONALISATION_ACTION_SECRET,
#                                    set where the Studio is built. That bundle is
#                                    public, so treat this as a speed bump against
#                                    drive-by traffic, not as real authentication.

[functions]
  directory = "netlify/functions"
  # Belt and braces. `directory` already means nothing outside netlify/functions
  # is scanned, and a build proved services/cutout reaches no bundle -- but the
  # cutout service is a whole second Node app in this repo, with its own
  # package.json and a 350 MB node_modules when anyone installs it locally, and
  # "nothing currently picks it up" is a weaker guarantee than saying so.
  #
  # An exclusion only. It copies nothing, which is the point: a top-level
  # included_files that ADDS a path applies to every function, and doing that
  # with the style references put 1.2 MB of JPEGs into all seventeen bundles
  # and raced on Windows. See the note below.
  included_files = ["!services/**"]
  # NOTE: the style references are deliberately NOT included here.
  #
  # They were, and a top-level included_files applies to EVERY function, so all
  # seventeen bundles carried the same 1.2 MB of JPEGs -- and the parallel
  # copies raced each other on Windows, failing the local dev build outright
  # with EBUSY on the shared source file. Only style-photo-background ever
  # reads them (loadStyleRefs is lazy, so merely importing _shared/style.mjs
  # does not), so the entry belongs in that function's block and nowhere else.

# A 24 x 16 in file at 300dpi is a 7200 x 4800 raster. Give the render job the
# most memory Netlify allows, and keep resvg out of the bundle -- it ships a
# native .node binary that esbuild cannot inline.
[functions."render-personalisation-background"]
  memory = 3008
  external_node_modules = ["@resvg/resvg-js"]

# The studio print master is the same size job, for the same reason -- and it
# now makes every other picture too, so sharp joins resvg here. Both ship a
# native .node binary that esbuild cannot inline.
[functions."studio-render-background"]
  memory = 3008
  external_node_modules = ["@resvg/resvg-js", "sharp"]

# studio-save renders the listing image itself, so it needs resvg too -- but it
# stays a synchronous function because it answers with the new product's URL.
# studio-save rasterises nothing any more -- it validates, writes the scene and
# the draft, and hands off. The memory is still worth having: prepareScene holds
# the composed SVG with every photograph inlined.
[functions."studio-save"]
  memory = 3008
  external_node_modules = ["@resvg/resvg-js"]

# The comic styling job. A background function: the model takes ~36s at 2K and
# ~52s at 4K, well past the 10s a synchronous function gets, and background
# functions have a 15-minute budget which is ample even for a slow 4K call.
#
# included_files lives HERE and only here. A per-function block does not
# inherit the top-level [functions] one, so without this line the style
# references are absent from this function's bundle -- and it is the only
# function that reads them, so it would be the only one that breaks.
#
# Memory: the three references are ~1.2 MB on disk and ~1.6 MB once base64'd
# into the request, and a 4K result decodes to a 5504 x 3072 surface for the
# JPEG re-encode. 1536 MB leaves room for both with the model response in
# flight; sharp stays out of the bundle for the same reason resvg does, since
# esbuild cannot inline a native .node binary.
[functions."style-photo-background"]
  memory = 1536
  included_files = ["netlify/functions/_shared/style-refs/*.jpg"]
  external_node_modules = ["sharp"]

# Photo retention, once a day. Customer photographs are deleted 90 days after
# the order was dispatched, and abandoned builds 30 days after creation; see
# netlify/functions/retention.mjs for the rules and what is exempt.
#
# The schedule lives here rather than in an inline `export const config`,
# matching how this project keeps function config out of the source files.
[functions."retention"]
  schedule = "@daily"

# The webhook posts to /api/render-personalisation. The function is a background
# function, so its real name carries the -background suffix; this rewrite keeps
# the caller unaware of that. It must come BEFORE the /api/* rule below, which
# would otherwise send it to a function of the wrong name.
[[redirects]]
  from = "/api/render-personalisation"
  to = "/.netlify/functions/render-personalisation-background"
  status = 200
  force = true

# Same arrangement again for the styling job: personalise-save and
# /api/personalisation-style post to /api/style-photo. Must come BEFORE the
# /api/* rule, which would otherwise look for a function named "style-photo".
[[redirects]]
  from = "/api/style-photo"
  to = "/.netlify/functions/style-photo-background"
  status = 200
  force = true

# Same arrangement for the studio print master: studio-save posts to
# /api/studio-render and does not need to know the -background suffix.
[[redirects]]
  from = "/api/studio-render"
  to = "/.netlify/functions/studio-render-background"
  status = 200
  force = true

# Route /api/* requests to Netlify Functions.
# Required for the contact form (src/pages/contact.astro POSTs to /api/contact
# which gets rewritten to /.netlify/functions/contact).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
